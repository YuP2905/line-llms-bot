[project]
name = "line-llms-bot"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.22",
    "pydantic-settings==2.13.1",
    "bcrypt==5.0.0",
    "line-bot-sdk==3.22.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.57.5",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "diffusers==0.37.0",
    "qwen-vl-utils==0.0.14",
    "decord==0.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true   # only torch/torchvision